<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Alimentar Firebase (Seed)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 bg-light">
  <div class="container">
    <h2>Alimentar Base de Dados</h2>
    <p>Este botão vai enviar os produtos e categorias do `dados-demo.js` para o Firebase.</p>
    <button id="btn-seed" class="btn btn-primary" onclick="enviarDados()">Enviar Dados para o Firebase</button>
    <div id="log" class="mt-4 font-monospace text-success" style="white-space: pre-wrap;"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script src="assets/js/config.js"></script>
  <script src="assets/js/dados-demo.js"></script>

  <script>
    const app = firebase.initializeApp(CONFIG.firebaseConfig);
    const db = firebase.firestore();

    async function enviarDados() {
      const log = document.getElementById("log");
      const btn = document.getElementById("btn-seed");
      log.innerHTML = "A ligar ao Firebase...\n";
      btn.disabled = true;

      try {
        // 1. Enviar categorias
        log.innerHTML += "A enviar categorias...\n";
        for (const cat of DADOS_DEMO.categorias) {
          await db.collection("categories").doc(cat.id).set(cat);
          log.innerHTML += `✅ Categoria "${cat.nome}" enviada.\n`;
        }

        // 2. Enviar produtos
        log.innerHTML += "A enviar produtos...\n";
        for (const prod of DADOS_DEMO.produtos) {
          await db.collection("products").doc(prod.id).set(prod);
          log.innerHTML += `✅ Produto "${prod.nome}" enviado.\n`;
        }

        log.innerHTML += "\n🎉 TUDO ENVIADO COM SUCESSO! Podes voltar ao site.";
        btn.style.display = "none";
      } catch (error) {
        log.innerHTML += `\n❌ Erro: ${error.message}\nVerifica se criaste a base de dados no modo de teste.`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
