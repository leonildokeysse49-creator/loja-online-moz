<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>A carregar Painel Admin...</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <!-- Teus Scripts (com ../ porque estamos dentro da pasta admin) -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/firebase.js"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="text-center">
    <i class="fa-solid fa-spinner fa-spin fa-2x text-primary mb-3"></i>
    <h4>A verificar permissões...</h4>
  </div>

  <script>
    // O Firebase vai verificar se existe uma sessão ativa
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Se estiver logado, vai direto para o dashboard
        window.location.href = "dashboard.html";
      } else {
        // Se não, vai para o login do admin
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
