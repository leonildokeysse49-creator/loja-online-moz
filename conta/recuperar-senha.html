<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><title>Recuperar Senha — Loja Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/conta.css">
</head>
<body class="bg-light">
  <div class="auth-wrapper">
    <div class="auth-card">
      <i class="fa-solid fa-key auth-icon"></i>
      <h2>Recuperar Senha</h2>
      <p class="sub">Insere o teu e-mail para receberes o link de recuperação.</p>
      <form id="form-recuperar">
        <div class="mb-3"><label class="form-label">E-mail</label><input type="email" class="form-control" id="rec-email" required></div>
        <div id="rec-erro" class="text-danger small text-center mb-2"></div>
        <div id="rec-sucesso" class="text-success small text-center mb-2"></div>
        <button type="submit" class="btn btn-primary w-100">Enviar Link</button>
      </form>
      <div class="text-center mt-3"><a href="login.html">Voltar ao login</a></div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/firebase.js"></script>
  <script>
    document.getElementById("form-recuperar").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("rec-email").value;
      const erro = document.getElementById("rec-erro");
      const sucesso = document.getElementById("rec-sucesso");
      erro.textContent = ""; sucesso.textContent = "";

      try {
        await auth.sendPasswordResetEmail(email);
        sucesso.textContent = "E-mail enviado! Verifica a tua caixa de entrada.";
      } catch (err) {
        erro.textContent = "Erro ao enviar. Verifica se o e-mail está correto.";
      }
    });
  </script>
</body>
</html>
