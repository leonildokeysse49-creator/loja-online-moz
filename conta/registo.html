<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — Loja Online</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" /><link rel="stylesheet" href="../assets/css/loja.css" /><link rel="stylesheet" href="../assets/css/conta.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top main-navbar"><div class="container"><a class="navbar-brand fw-bolder d-flex align-items-center gap-2" href="../index.html"><span class="brand-mark"><i class="fa-solid fa-bag-shopping"></i></span><span>Loja <span class="text-primary">Online</span></span></a></div></nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <i class="fa-solid fa-user-plus auth-icon"></i>
      <h2>Criar conta</h2>
      <p class="sub">Demora menos de 1 minuto.</p>
      <form id="form-registo" novalidate>
        <div class="mb-3"><label class="form-label" for="reg-nome">Nome completo</label><input type="text" class="form-control" id="reg-nome" placeholder="Ex: João Silva" required /></div>
        <div class="mb-3"><label class="form-label" for="reg-email">E-mail</label><input type="email" class="form-control" id="reg-email" placeholder="nome@exemplo.com" required /></div>
        <div class="mb-3"><label class="form-label" for="reg-telefone">Telefone</label><input type="tel" class="form-control" id="reg-telefone" placeholder="Ex: 84 123 4567" required /></div>
        <div class="mb-3"><label class="form-label" for="reg-pass">Palavra-passe</label><input type="password" class="form-control" id="reg-pass" placeholder="••••••••" required /></div>
        <div id="reg-erro" class="text-danger small text-center mb-3"></div>
        <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Criar conta</button>
      </form>
      <div class="text-center mt-4 small">Já tens conta? <a href="login.html" class="fw-bold text-decoration-none">Entrar</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../assets/js/config.js"></script><script src="../assets/js/firebase.js"></script><script src="../assets/js/utilitarios.js"></script><script src="../assets/js/autenticacao.js"></script><script src="../assets/js/conta.js"></script>
  <script>document.addEventListener("DOMContentLoaded", inicializarRegisto);</script>
</body>
</html>
