<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encomendas — Fashion Key Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header"><h1 class="page-title">Encomendas</h1></header>
      <div class="admin-content">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="table-responsive">
            <table class="admin-table">
              <thead><tr><th>Encomenda / Data</th><th>Cliente</th><th>Total</th><th>Estado</th><th class="text-end">Ação</th></tr></thead>
              <tbody id="tabela-encomendas"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="modal fade" id="modal-custo-entrega" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header bg-warning"><h5 class="modal-title fw-bold">Definir Entrega</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p>Encomenda: <strong id="modal-custo-num"></strong></p>
        <label class="form-label">Custo (MZN)</label>
        <input type="number" class="form-control" id="modal-custo-input" min="0">
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="confirmarCustoEntrega()">Confirmar</button></div>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/dados-demo.js"></script>
  <script src="../../assets/js/utilitarios.js"></script>
  <script src="../../assets/js/encomendas.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script>document.addEventListener("DOMContentLoaded", inicializarAdmin);</script>
</body>
</html>
