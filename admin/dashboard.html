<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Fashion Key Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header"><h1 class="page-title">Visão Geral</h1></header>
      <div class="admin-content">
        <div class="row g-4 mb-4">
          <div class="col-md-4"><div class="stat-card"><div class="stat-icon azul"><i class="fa-solid fa-shopping-bag"></i></div><div class="stat-info"><h3 id="stat-total-encomendas">0</h3><p>Total de Encomendas</p></div></div></div>
          <div class="col-md-4"><div class="stat-card"><div class="stat-icon amarelo"><i class="fa-solid fa-clock"></i></div><div class="stat-info"><h3 id="stat-pendentes">0</h3><p>Pendentes</p></div></div></div>
          <div class="col-md-4"><div class="stat-card"><div class="stat-icon verde"><i class="fa-solid fa-money-bill-wave"></i></div><div class="stat-info"><h3 id="stat-receita">0 MZN</h3><p>Receita</p></div></div></div>
        </div>
        <div class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white p-4 border-0"><h5 class="mb-0 fw-bold">Últimas Encomendas</h5></div>
        <div class="table-responsive"><table class="admin-table"><thead><tr><th>Nº</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody id="ultimas-encomendas"></tbody></table></div></div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/firebase.js"></script>
  <script src="../assets/js/dados-demo.js"></script>
  <script src="../assets/js/utilitarios.js"></script>
  <script src="../assets/js/encomendas.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>document.addEventListener("DOMContentLoaded", inicializarAdmin);</script>
</body>
</html>
