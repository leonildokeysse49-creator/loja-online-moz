<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><title>Configurações — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header"><h1 class="page-title">Configurações Gerais</h1></header>
      <div class="admin-content">
        <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 800px;">
          <form id="form-config-geral">
            
            <h5 class="fw-bold mb-3">Dados da Loja</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><label class="form-label">Nome da Loja</label><input type="text" class="form-control" id="conf-nome" value="Loja Online"></div>
              <div class="col-md-6"><label class="form-label">Moeda</label><input type="text" class="form-control" value="MZN" disabled></div>
              <div class="col-md-6"><label class="form-label">Telefone de Suporte</label><input type="text" class="form-control" id="conf-telefone" value="853 217 149"></div>
              <div class="col-md-6"><label class="form-label">E-mail de Suporte</label><input type="email" class="form-control" id="conf-email" value="Leonildokeysse49@gmail.com"></div>
            </div>

            <h5 class="fw-bold mb-3">Regras de Stock</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><label class="form-label">Duração da Reserva (Minutos)</label><input type="number" class="form-control" id="conf-reserva" value="15"></div>
            </div>

            <!-- NOVO CAMPO: DATA DE FIM DA PROMOÇÃO -->
            <h5 class="fw-bold mb-3 text-danger"><i class="fa-solid fa-fire me-2"></i>Campanha Promocional</h5>
            <div class="row g-3 mb-4">
              <div class="col-12">
                <label class="form-label fw-bold">Data e Hora de Fim das Promoções</label>
                <input type="datetime-local" class="form-control" id="conf-promo-fim">
                <div class="form-text">O contador na página de promoções vai usar esta data. Deixa vazio para desativar o contador.</div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary fw-bold px-4">Guardar Alterações</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/dados-demo.js"></script>
  <script src="../../assets/js/utilitarios.js"></script>
  <script src="../../assets/js/encomendas.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script>document.addEventListener("DOMContentLoaded", inicializarAdmin);</script>
</body>
</html>
