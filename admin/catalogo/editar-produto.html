<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Produto — Fashion Key Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header"><h1 class="page-title">Editar Produto</h1></header>
      <div class="admin-content">
        <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 800px;">
          <form onsubmit="atualizarProduto(event)">
            <input type="hidden" id="prod-id">
            <div class="row g-3 mb-4">
              <div class="col-12"><label class="form-label fw-bold">Nome do Produto</label><input type="text" class="form-control" id="prod-nome" required></div>
              <div class="col-md-4"><label class="form-label fw-bold">Preço (MZN)</label><input type="number" class="form-control" id="prod-preco" min="0" required></div>
              <div class="col-md-4"><label class="form-label fw-bold">Preço Antigo</label><input type="number" class="form-control" id="prod-precoAntigo" min="0"></div>
              <div class="col-md-4"><label class="form-label fw-bold">Stock</label><input type="number" class="form-control" id="prod-stock" min="0" required></div>
              <div class="col-md-6"><label class="form-label fw-bold">Categoria</label><select class="form-select" id="prod-categoria" required><option value="">A carregar...</option></select></div>
              <div class="col-12">
                <label class="form-label fw-bold mb-2">Imagem do Produto</label>
                <div class="mb-2">
                  <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="tipo-imagem" id="radio-url" value="url" checked onchange="toggleTipoImagem()"><label class="form-check-label" for="radio-url">Link (URL)</label></div>
                  <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="tipo-imagem" id="radio-upload" value="upload" onchange="toggleTipoImagem()"><label class="form-check-label" for="radio-upload">Upload</label></div>
                </div>
                <div id="div-imagem-url"><input type="url" class="form-control" id="prod-imagem-url"></div>
                <div id="div-imagem-upload" style="display: none;"><input type="file" class="form-control" id="prod-imagem-file" accept="image/*"><div class="form-text text-muted mt-1">Se não selecionares, a imagem atual mantém-se.</div></div>
              </div>
              <div class="col-12"><label class="form-label fw-bold">Descrição</label><textarea class="form-control" id="prod-descricao" rows="3"></textarea></div>
            </div>
            <h6 class="fw-bold mb-3">Definições</h6>
            <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="prod-ativo"><label class="form-check-label" for="prod-ativo">Produto Ativo</label></div>
            <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="prod-destaque"><label class="form-check-label" for="prod-destaque">Mostrar em Destaque</label></div>
            <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="prod-novo"><label class="form-check-label" for="prod-novo">Marcar como Novidade</label></div>
            <button type="submit" class="btn btn-primary fw-bold"><i class="fa-solid fa-floppy-disk me-2"></i> Atualizar Produto</button>
            <a href="produtos.html" class="btn btn-light border ms-2">Cancelar</a>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/dados-demo.js"></script>
  <script src="../../assets/js/utilitarios.js"></script>
  <script src="../../assets/js/encomendas.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script>document.addEventListener("DOMContentLoaded", inicializarAdmin);</script>
</body>
</html>
