<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><title>Produtos — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    
    <main class="admin-main">
      <header class="admin-header">
        <h1 class="page-title">Produtos</h1>
        <a href="novo-produto.html" class="btn btn-primary btn-sm fw-bold">
          <i class="fa-solid fa-plus me-1"></i> Novo Produto
        </a>
      </header>

      <div class="admin-content">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="table-responsive">
            <table class="admin-table">
              <thead class="bg-light">
                <tr>
                  <th style="width: 50%;">Produto</th>
                  <th style="width: 15%;">Preço</th>
                  <th style="width: 15%;">Stock</th>
                  <th style="width: 20%;" class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-produtos">
                <tr><td colspan="4" class="text-center py-4 text-muted">A carregar dados do Firebase...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/dados-demo.js"></script>
  <script src="../../assets/js/utilitarios.js"></script>
  <script src="../../assets/js/encomendas.js"></script>
  <script src="../../assets/js/admin.js"></script>
  
  <script>
    // Usar DOMContentLoaded simples para não haver conflitos
    document.addEventListener("DOMContentLoaded", inicializarAdmin);
  </script>
</body>
</html>
