<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Categoria — Fashion Key Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header"><h1 class="page-title">Criar Nova Categoria</h1></header>
      <div class="admin-content">
        <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 800px;">
          <form onsubmit="salvarNovaCategoria(event)">
            <div class="mb-3"><label class="form-label fw-bold">Nome da Categoria</label><input type="text" class="form-control" id="cat-nome" placeholder="Ex: Eletrodomésticos" required></div>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label fw-bold">Ícone (Font Awesome)</label><input type="text" class="form-control" id="cat-icone" placeholder="Ex: fa-blender" value="fa-tags"><div class="form-text">Visita fontawesome.com/icons para copiar o nome.</div></div>
            </div>
            <div class="mb-4"><label class="form-label fw-bold">Descrição Curta</label><textarea class="form-control" id="cat-descricao" rows="2" placeholder="Ex: Frigoríficos, fogões e micro-ondas."></textarea></div>
            <button type="submit" class="btn btn-primary fw-bold"><i class="fa-solid fa-floppy-disk me-2"></i> Guardar Categoria</button>
            <a href="categorias.html" class="btn btn-light border ms-2">Cancelar</a>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/dados-demo.js"></script>
  <script src="../../assets/js/utilitarios.js"></script>
  <script src="../../assets/js/encomendas.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script>document.addEventListener("DOMContentLoaded", inicializarAdmin);</script>
</body>
</html>
