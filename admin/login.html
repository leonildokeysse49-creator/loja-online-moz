<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Admin — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 400px; border-radius: 20px;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 60px; height: 60px;"><i class="fa-solid fa-lock fs-3"></i></div>
      <h3 class="fw-bold">Acesso Restrito</h3>
    </div>
    <form onsubmit="event.preventDefault(); if(loginAdmin(document.getElementById('email').value, document.getElementById('pass').value)) window.location.href='dashboard.html'; else alert('Credenciais inválidas.');">
      <div class="mb-3"><label class="form-label">E-mail</label><input type="email" class="form-control" id="email" value="admin@loja.co.mz" required></div>
      <div class="mb-3"><label class="form-label">Palavra-passe</label><input type="password" class="form-control" id="pass" value="admin123" required></div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar</button>
    </form>
    <div class="text-center mt-3"><a href="../index.html" class="text-muted small text-decoration-none">Voltar à loja</a></div>
  </div>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utilitarios.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
