<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Admin — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 400px; border-radius: 20px;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 60px; height: 60px;">
        <i class="fa-solid fa-lock fs-3"></i>
      </div>
      <h3 class="fw-bold">Acesso Restrito</h3>
    </div>
    
    <form id="form-admin-login">
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" id="admin-email" value="admin@loja.co.mz" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Palavra-passe</label>
        <input type="password" class="form-control" id="admin-pass" value="admin123" required>
      </div>
      <div id="admin-login-erro" class="text-danger small text-center mb-3"></div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btn-admin-login">Entrar</button>
    </form>
    
    <div class="text-center mt-3">
      <a href="../index.html" class="text-muted small text-decoration-none">Voltar à loja</a>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/firebase.js"></script>
  
  <script>
    document.getElementById("form-admin-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-admin-login");
      const erro = document.getElementById("admin-login-erro");
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> A entrar...';
      erro.textContent = "";

      const email = document.getElementById("admin-email").value;
      const pass = document.getElementById("admin-pass").value;

      try {
        await auth.signInWithEmailAndPassword(email, pass);
        // Se o login der certo, vai para o dashboard
        window.location.href = "dashboard.html";
      } catch (error) {
        console.error(error);
        erro.textContent = "E-mail ou palavra-passe incorretos.";
        btn.disabled = false;
        btn.innerHTML = 'Entrar';
      }
    });
  </script>
</body>
</html>
