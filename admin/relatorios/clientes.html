<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Clientes — Fashion Key Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header"><h1 class="page-title">Relatório de Clientes</h1></header>
      <div class="admin-content">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="table-responsive">
            <table class="admin-table">
              <thead><tr><th>Cliente</th><th>Telefone</th><th>Compras</th><th>Total Gasto</th></tr></thead>
              <tbody id="tabela-relatorio-clientes"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/dados-demo.js"></script>
  <script src="../../assets/js/utilitarios.js"></script>
  <script src="../../assets/js/encomendas.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await inicializarAdmin(); // Desenha o menu PRIMEIRO
      
      const tbody = document.getElementById("tabela-relatorio-clientes");
      try {
        const snapshot = await db.collection("orders").get();
        const clis = {};
        snapshot.forEach(doc => {
          const enc = doc.data();
          const tel = enc.customerSnapshot.telefone;
          if (!clis[tel]) clis[tel] = { nome: enc.customerSnapshot.nome, tel: tel, n: 0, total: 0 };
          clis[tel].n++;
          if (enc.orderStatus !== "cancelada") clis[tel].total += (enc.total || enc.subtotal);
        });
        let clientesArr = Object.values(clis).sort((a, b) => b.total - a.total);
        tbody.innerHTML = clientesArr.length ? clientesArr.map(c => `<tr><td class="fw-bold">${c.nome}</td><td>${c.tel}</td><td>${c.n}</td><td class="text-success fw-bold">${formatarMZN(c.total)}</td></tr>`).join("") : "<tr><td colspan='4' class='text-center'>Sem clientes.</td></tr>";
      } catch (err) { tbody.innerHTML = "<tr><td colspan='4' class='text-danger text-center'>Erro.</td></tr>"; }
    });
  </script>
</body>
</html>
