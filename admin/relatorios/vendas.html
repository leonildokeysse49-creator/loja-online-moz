<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><title>Relatório de Vendas — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header"><h1 class="page-title">Relatório de Vendas</h1></header>
      <div class="admin-content">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="table-responsive">
            <table class="admin-table">
              <thead><tr><th>Data</th><th>Nº Encomendas</th><th>Receita Total</th></tr></thead>
              <tbody id="tabela-relatorio-vendas"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../../assets/js/config.js"></script><script src="../../assets/js/firebase.js"></script><script src="../../assets/js/utilitarios.js"></script><script src="../../assets/js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      protegerAdmin();
      renderizarSidebarAdmin();
      const tbody = document.getElementById("tabela-relatorio-vendas");
      
      try {
        const snapshot = await db.collection("orders").get();
        let total = 0, count = 0;
        snapshot.forEach(doc => {
          const e = doc.data();
          if (e.orderStatus !== "cancelada") {
             total += (e.total || e.subtotal);
             count++;
          }
        });
        tbody.innerHTML = `<tr><td>Hoje (Acumulado)</td><td>${count}</td><td class="fw-bold text-success">${formatarMZN(total)}</td></tr>`;
      } catch (err) { tbody.innerHTML = "<tr><td colspan='3'>Erro.</td></tr>"; }
    });
  </script>
</body>
</html>
